input_select:
  udendors_lys_tilstand:
    options:
      - "Off"
      - "Dim"
      - "Full"
    name: Udendørs lys tilstand
  hoveddor_lys_tilstand:
    options:
      - "Off"
      - "Dim"
      - "Full"
    name: Hoveddør lys tilstand
  kontor_lys_tilstand:
    options:
      - "Off"
      - "Dim"
      - "Full"
    name: Kontor lys tilstand
  tilbygning_lys_tilstand:
    options:
      - "Off"
      - "Dim"
      - "Full"
    name: Tilbygning lys tilstand

input_number:
  carport_dim_brightness:
    min: 25
    max: 100
    step: 1
    initial: 32
    name: Carport dim brightness
  hoveddor_dim_brightness:
    min: 25
    max: 100
    step: 1
    initial: 32
    name: Hoveddør dim brightness
  kontor_dim_brightness:
    min: 25
    max: 100
    step: 1
    initial: 32
    name: Kontor dim brightness
  tilbygning_dim_brightness:
    min: 25
    max: 100
    step: 1
    initial: 32
    name: Tilbygning dim brightness
  udendors_full_brightness:
    min: 30
    max: 100
    step: 1
  udendors_min_lux_for_dim:
    min: 5
    max: 50
    step: 1
  udendors_max_lux_for_off:
    min: 5
    max: 50
    step: 1

input_boolean:
  dim_available:

input_datetime:
  tid_for_dim_available1:
    name: Dæmpet lys tilgængelig fra 1
    has_time: true
    has_date: false
  tid_for_dim_available2:
    name: Dæmpet lys tilgængelig fra 2
    has_time: true
    has_date: false
  tid_for_dim_unavailable1:
    name: Dæmpet lys slukket fra 1
    has_time: true
    has_date: false
  tid_for_dim_unavailable2:
    name: Dæmpet lys slukket fra 2
    has_time: true
    has_date: false

template:
  - binary_sensor:
      - name: Tilbygning Occupancy
        unique_id: outdoor_tilbygning_combined_occupancy
        device_class: occupancy
        state: >-
          {{ is_state('binary_sensor.forhave_bevaegelsessensor_occupancy', 'on')
             or is_state('binary_sensor.terasse_bevaegelsessensor_occupancy', 'on') }}

sensor:
  - platform: min_max
    name: Outdoor Lowest Illuminance
    type: min
    entity_ids:
      - sensor.forhave_bevaegelsessensor_illuminance
      - sensor.carport_bevaegelsessensor_illuminance
      - sensor.hoveddor_bevaegelsessensor_illuminance
      - sensor.kontor_bevaegelsessensor_illuminance
      - sensor.tilbygning_bevaegelsessensor_illuminance