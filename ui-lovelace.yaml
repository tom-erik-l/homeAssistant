views:
  - path: default_view
    title: Home
    cards:
      - type: entities
        title: Fælles indstillinger
        show_header_toggle: false
        entities:
          - entity: input_number.udendors_dim_brightness
            name: Dæmpet lys niveau
          - entity: input_number.udendors_full_brightness
            name: Max lys niveau
          - entity: input_number.udendors_min_lux_for_dim
            name: Min. lux for dæmpet tænding
          - entity: input_number.udendors_max_lux_for_off
            name: Max. lux inden dæmpet slukning
          - entity: input_boolean.dim_available
            name: Dæmpet tilgængelig
          - entity: input_datetime.tid_for_dim_available1
          - entity: input_datetime.tid_for_dim_unavailable1
          - entity: input_datetime.tid_for_dim_available2
          - entity: input_datetime.tid_for_dim_unavailable2

      - type: entities
        title: Carport
        show_header_toggle: false
        entities:
          - entity: input_select.udendors_lys_tilstand
            name: Tilstand
          - entity: light.grp_forhave_lys
            name: Carport og hoveddør gruppe
          - entity: light.carport_lys
            name: Carport
          - entity: light.hoveddor_lys
            name: Hoveddør
          - entity: sensor.carport_bevaegelsessensor_illuminance
            name: Illuminance
          - entity: binary_sensor.carport_bevaegelsessensor_occupancy
            name: Occupancy
          - entity: sensor.carport_bevaegelsessensor_temperature
            name: Temperature

      - type: entities
        title: Kontor
        show_header_toggle: false
        entities:
          - entity: input_select.kontor_lys_tilstand
            name: Tilstand
          - entity: light.kontor_lys
            name: Kontor
          - entity: sensor.kontor_bevaegelsessensor_illuminance
            name: Illuminance
          - entity: binary_sensor.kontor_bevaegelsessensor_occupancy
            name: Occupancy
          - entity: sensor.kontor_bevaegelsessensor_temperature
            name: Temperature

      - type: entities
        title: Tilbygning
        show_header_toggle: false
        entities:
          - entity: input_select.tilbygning_lys_tilstand
            name: Tilstand
          - entity: light.tilbygning_lys
            name: Tilbygning
          - entity: sensor.terasse_bevaegelsessensor_illuminance
            name: Illuminance
          - entity: binary_sensor.terasse_bevaegelsessensor_occupancy
            name: Occupancy
          - entity: sensor.terasse_bevaegelsessensor_temperature
            name: Temperature

      - type: entities
        title: Alle udendørs lys
        show_header_toggle: false
        entities:
          - entity: light.grp_udendors_lys
            name: Samlet lysgruppe

